[project]
name = "kegger"
version = "0.1.1"
description = "Interact with KEGG API"
readme = "README.md"
authors = [
    { name = "csaltikov", email = "saltikov@ucsc.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.3",
    "pandas-stubs==2.3.3.260113",
    "requests>=2.32.5",
    "requests-cache>=1.2.1",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.2",
    "pandas-stubs>=2.3.3.260113",
    "types-pytz>=2025.2.0.20251108",
]
